name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what did you see instead of what you expected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hover over the notch
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 27.0.1, MacBook Pro 14-inch (M4)
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display
      options:
        - Built-in display with a notch
        - Built-in display without a notch
        - External display
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and could not find this one.
          required: true
